name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm run package
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
      - name: Verify packaged installation
        run: |
          npm install --offline --ignore-scripts --prefix "$RUNNER_TEMP/fission-install" ./dist/*.tgz
          cli="$RUNNER_TEMP/fission-install/node_modules/fission/src/cli.mjs"
          node "$cli" help
          node "$cli" help rent
          node "$cli" advanced skill install --output "$RUNNER_TEMP/fission-skill"
          test -x "$RUNNER_TEMP/fission-install/node_modules/fission/tui/target/release/fission-tui"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --latest \
            --title "Fission v$version" --notes-file docs/release-notes.md
